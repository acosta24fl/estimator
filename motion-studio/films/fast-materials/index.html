<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Price It On The Driveway</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --deep: #12141c; --border: #2a2d3a;
    --text: #e0e0e0; --strong: #fff; --muted: #888; --accent: #4a8cff;
    --accent-soft: #7eb8ff; --money: #4aff8c; --warn: #ffaa4a; --danger: #ff4d4d;
    --display: 'Inter Display', Inter, 'Segoe UI', sans-serif;
    --body: Inter, 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    color: var(--text); font-family: var(--body); transform-origin: 0 0; }
  .scene { position: absolute; inset: 0; display: none; transform-origin: 50% 50%; }
  .abs { position: absolute; }
  .headline { font-family: var(--display); font-weight: 800; letter-spacing: -0.035em; color: var(--strong); line-height: 1.02; white-space: nowrap; }
  .sub { font-weight: 500; color: var(--muted); font-size: 40px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .mask { overflow: hidden; padding-bottom: 0.12em; }
  .mask > span { display: inline-block; }
  .grid-bg { position: absolute; inset: -10%;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(ellipse at 40% 50%, #000 20%, transparent 70%); }

  /* ---- app UI, same CSS values as index.html (rendered at app size, then scaled) ---- */
  .app { position: absolute; width: 860px; transform-origin: 0 0; font-family: var(--body); }
  .section { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 24px;
    box-shadow: 0 40px 80px -30px #000; }
  .section h2 { font-size: 1.15rem; margin-bottom: 16px; color: #7eb8ff; display: flex; align-items: center; gap: 8px; }
  .section h2 .icon { font-size: 1.3rem; font-family: 'Noto Color Emoji', sans-serif; }
  .field { background: #12141c; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; color: #e0e0e0;
    font-size: 0.95rem; height: 39px; white-space: nowrap; overflow: hidden; position: relative; }
  .field.focus { border-color: #7eb8ff; }
  .field .ph { color: #757575; }
  .caret { display: inline-block; width: 1.5px; height: 1.1em; background: #e0e0e0; vertical-align: -0.15em; margin-left: 1px; }
  .materials-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .material-row { display: flex; gap: 8px; align-items: center; }
  .material-row .field:nth-child(1) { flex: 2; } .material-row .field:nth-child(2) { flex: 1; } .material-row .field:nth-child(3) { flex: 0.6; }
  .rm { background: #ff4d4d; color: #fff; width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 1.1rem; }
  .btn-add { display: inline-block; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
    background: #2a3a50; color: #7eb8ff; border: 1px dashed #7eb8ff55; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
  .btn-calculate { margin-top: 14px; background: linear-gradient(135deg, #4a8cff, #2a5cbd); color: #fff; font-size: 1.1rem;
    font-weight: 600; padding: 14px 32px; width: 100%; border-radius: 10px; text-align: center; }

  /* tiers (same as launch film) */
  .tier { position: absolute; top: 300px; width: 480px; height: 400px; border-radius: 18px; background: var(--deep);
    border: 2px solid var(--border); text-align: center; padding-top: 64px; }
  .tier h3 { font-size: 40px; font-weight: 700; color: #aaa; }
  .tier .desc { font-size: 26px; color: #777; margin-top: 10px; }
  .tier .price { font-size: 72px; font-weight: 700; color: var(--strong); margin-top: 34px; letter-spacing: -0.02em; }
  .tier .tag { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff;
    font-weight: 700; font-size: 22px; letter-spacing: 0.12em; padding: 10px 20px; border-radius: 8px; }

  .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; filter: drop-shadow(0 6px 10px #000a); transform-origin: 6px 4px; }
  #flash { position: absolute; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, #000000a0 100%); }
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; }
  #fadeout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px;
    background: #000c; color: #ddd; font: 14px Inter, sans-serif; z-index: 10; }
  #controls input[type=range] { flex: 1; }
  #controls button { background: #4a8cff; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">

  <section class="scene" id="s-hook">
    <div class="grid-bg"></div>
    <div class="abs" id="hook" style="left:160px; top:430px; transform-origin: 0 50%">
      <span class="headline" style="font-size:150px">Customer wants a price.</span>
    </div>
  </section>

  <section class="scene" id="s-now">
    <div class="grid-bg"></div>
    <div class="abs" id="now" style="left:0; right:0; top:390px; text-align:center">
      <span class="headline" style="font-size:260px">Right <span id="now-word">now.</span></span>
    </div>
  </section>

  <section class="scene" id="s-mat">
    <div class="app" id="mat-card" style="left:208px; top:250px">
      <div class="section">
        <h2><span class="icon">📦</span> Materials</h2>
        <div class="materials-list">
          <div class="material-row" id="row1">
            <div class="field" id="m1-name"></div><div class="field" id="m1-cost"></div><div class="field" id="m1-qty"></div><div class="rm">×</div>
          </div>
          <div class="material-row" id="row2" style="overflow:hidden">
            <div class="field" id="m2-name"></div><div class="field" id="m2-cost"></div><div class="field" id="m2-qty"></div><div class="rm">×</div>
          </div>
        </div>
        <div class="btn-add" id="btn-add">+ Add Material</div>
      </div>
    </div>
    <div class="abs" id="subtotal" style="right:216px; top:770px; text-align:right">
      <div class="sub" style="font-size:28px; letter-spacing:0.14em; font-weight:700">MATERIALS</div>
      <div class="mono" id="subtotal-v" style="font-size:88px; font-weight:700; color:var(--strong)">$0.00</div>
    </div>
  </section>

  <section class="scene" id="s-labor">
    <div class="app" id="labor-card" style="left:268px; top:190px">
      <div class="section">
        <h2><span class="icon">✍</span> Labor</h2>
        <div class="form-grid">
          <div class="form-group"><label>Your Hourly Rate ($)</label><div class="field" id="l-rate"></div></div>
          <div class="form-group"><label>Estimated Hours</label><div class="field" id="l-hours"></div></div>
          <div class="form-group"><label>Skill Level Compared to Pro</label><div class="field">Professional (100%)</div></div>
          <div class="form-group"><label>Number of Workers (including you)</label><div class="field">1</div></div>
        </div>
      </div>
      <div class="btn-calculate" id="gen-btn">Generate Estimate</div>
    </div>
  </section>

  <section class="scene" id="s-tap">
    <div class="abs" style="left:0; right:0; top:300px; text-align:center">
      <div class="sub" style="font-size:34px; letter-spacing:0.16em; font-weight:700">YOUR PRICE</div>
      <div class="mono" id="total" style="font-size:220px; font-weight:700; color:var(--strong); letter-spacing:-0.04em; line-height:1.15">$0.00</div>
      <div class="sub" id="tap-sub" style="font-size:40px">Every cost included.</div>
    </div>
  </section>

  <section class="scene" id="s-tiers">
    <div id="tiers"></div>
    <div class="abs mask" id="tiers-caption" style="left:0;right:0;top:810px;text-align:center">
      <span class="headline" style="font-size:72px">Three prices. <span style="color:var(--accent-soft)">One tap.</span></span>
    </div>
  </section>

  <section class="scene" id="s-end">
    <img id="end-icon" class="abs" src="../../brand/icon-512.png" style="width:150px;height:150px;left:160px;top:290px;border-radius:34px">
    <div class="abs mask" id="end-line" style="left:150px; top:470px">
      <span class="headline" style="font-size:150px">Price it on the <span style="color:var(--money)">driveway.</span></span>
    </div>
    <div class="abs" id="end-sub" style="left:164px; top:680px">
      <span class="sub" style="font-size:44px">Free <span style="color:#444">·</span> Works offline <span style="color:#444">·</span> On your phone</span>
    </div>
  </section>

  <svg id="cursor" class="cursor" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0f1117" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="flash"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="fadeout"></div>
</div>

<div id="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <span id="clock">0.00s</span>
</div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  expoOut: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  expoIn: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  expoInOut: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  backOut: (p, s = 1.35) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
  sineInOut: p => -(Math.cos(Math.PI * p) - 1) / 2,
};
const $ = id => document.getElementById(id);
const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const parseMoney = s => parseFloat(s.replace(/[$,]/g, ''));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let BEATS, EST, SPB, DURATION;
const beat = n => n * SPB;
const LEAD = 0.1; // visuals ~3 frames early so the on-beat frame shows the hit
const event = id => { const e = BEATS.events.find(e => e.id === id); if (!e) throw new Error('unknown event ' + id); return e; };
const evExact = id => beat(event(id).beat);
const ev = id => evExact(id) - LEAD;
const P = (t, start, beats, ease = E.expoOut) => ease(clamp((t - start) / beat(beats)));

// The sample job (matches brand/sample-estimate.json: materials $331.00)
const JOB = { m1: ['Porcelain tile', '4.25', '60'], m2: ['Thinset + grout', '38', '2'], rate: '45', hours: '10' };
const PLACEHOLDER = { name: 'Material name', cost: 'Unit cost ($)', qty: 'Qty' };
const APP_SCALE = 1.75;

// Typed text for a field whose typing is the event `id` (spread over its lengthBeats).
function typed(t, id, text) {
  const s = evExact(id), len = beat(event(id).lengthBeats || 1);
  return text.slice(0, Math.floor(clamp((t - s) / len) * text.length + 1e-6));
}
function field(el, value, placeholder, focus, t) {
  const blink = Math.floor(t * 3.2) % 2 === 0;
  el.classList.toggle('focus', focus);
  el.innerHTML = (value ? value : `<span class="ph">${focus ? '' : placeholder}</span>`) +
    (focus && blink ? '<span class="caret"></span>' : '') + (!value && focus ? `<span class="ph">${placeholder}</span>` : '');
}
// Puts the shared cursor on an element (scene coords), pressing at `pressAt`.
function cursorTo(t, el, from, arriveAt, moveBeats, pressAt, scene) {
  const st = $('stage').getBoundingClientRect(), r = el.getBoundingClientRect(), k = st.width / 1920;
  const target = { x: (r.left + r.width * 0.55 - st.left) / k, y: (r.top + r.height * 0.6 - st.top) / k };
  const mv = P(t, arriveAt - beat(moveBeats), moveBeats, E.expoInOut);
  const press = clamp(1 - Math.abs(t - pressAt) / beat(0.25));
  $('cursor').style.display = 'block';
  $('cursor').style.transform = `translate(${lerp(from.x, target.x, mv)}px,${lerp(from.y, target.y, mv)}px) scale(${1 - 0.1 * press})`;
  return press;
}

function build() {
  const names = [['Budget', 'Tight margins'], ['Standard', 'Fair, sustainable profit'], ['Premium', 'Rush & complex work']];
  $('tiers').innerHTML = names.map(([n, d], i) =>
    `<div class="tier" id="tier${i}" style="left:${180 + i * 540}px">${i === 1 ? '<div class="tag" id="rec-tag">RECOMMENDED</div>' : ''}
       <h3>${n}</h3><div class="desc">${d}</div><div class="price mono">${EST.tiers[i]}</div></div>`).join('');
  $('mat-card').style.transform = `scale(${APP_SCALE})`;
  $('labor-card').style.transform = `scale(${APP_SCALE})`;
}

const scenes = {
  hook(t) {
    const p = clamp((t - ev('hook.in')) / beat(0.75));
    $('hook').style.opacity = clamp(p * 3);
    $('hook').style.transform = `scale(${p <= 0 ? 1.2 : lerp(1.2, 1, E.backOut(p, 1.1))})`;
  },
  now(t) {
    const p = clamp((t - ev('now.in')) / beat(0.75));
    $('now').style.opacity = clamp(p * 3);
    const f = clamp(1 - (t - ev('now.flash')) / beat(1));
    $('now').style.transform = `scale(${(p <= 0 ? 1.25 : lerp(1.25, 1, E.backOut(p, 1.1))) * (t >= ev('now.flash') ? 1 + 0.05 * E.expoIn(f) : 1)})`;
    $('now-word').style.color = t >= ev('now.flash') ? 'var(--warn)' : '';
  },
  mat(t, s0, s1) {
    const enter = P(t, ev('mat.in'), 1.5);
    const push = E.sineInOut(clamp((t - s0) / (s1 - s0)));
    $('mat-card').style.transform = `translateY(${lerp(120, 0, enter) - push * 30}px) scale(${APP_SCALE * lerp(0.94, 1.02, push)})`;
    $('mat-card').style.opacity = clamp(enter * 2);

    // row 1
    const n1 = typed(t, 'm1.name', JOB.m1[0]), c1 = typed(t, 'm1.cost', JOB.m1[1]);
    const qStart = evExact('m1.qty');
    const q1 = t < qStart ? '1' : typed(t, 'm1.qty', JOB.m1[2]);
    const focus1 = t < evExact('m1.cost') - beat(0.25) ? 0 : t < qStart - beat(0.25) ? 1 : t < evExact('add.click') - beat(1) ? 2 : -1;
    field($('m1-name'), n1, PLACEHOLDER.name, focus1 === 0 && t >= evExact('m1.name') - beat(0.5), t);
    field($('m1-cost'), c1, PLACEHOLDER.cost, focus1 === 1, t);
    field($('m1-qty'), q1, PLACEHOLDER.qty, focus1 === 2, t);

    // add row 2 on click
    const addT = evExact('add.click');
    const grow = P(t, ev('add.click'), 0.5);
    $('row2').style.display = t >= addT - LEAD ? 'flex' : 'none';
    $('row2').style.height = (39 * grow) + 'px';
    $('row2').style.opacity = grow;
    const n2 = typed(t, 'm2.name', JOB.m2[0]), c2 = typed(t, 'm2.cost', JOB.m2[1]);
    const q2 = t < evExact('m2.qty') ? '1' : typed(t, 'm2.qty', JOB.m2[2]);
    const focus2 = t < addT ? -1 : t < evExact('m2.cost') - beat(0.25) ? 0 : t < evExact('m2.qty') - beat(0.25) ? 1 : 2;
    field($('m2-name'), n2, PLACEHOLDER.name, focus2 === 0, t);
    field($('m2-cost'), c2, PLACEHOLDER.cost, focus2 === 1, t);
    field($('m2-qty'), q2, PLACEHOLDER.qty, focus2 === 2, t);

    // cursor taps "+ Add Material"
    const press = t > addT - beat(2) && t < addT + beat(1.5)
      ? cursorTo(t, $('btn-add'), { x: 1500, y: 1000 }, addT, 1.2, addT) : null;
    if (press === null) $('cursor').style.display = 'none';
    else {
      const away = P(t, addT + beat(0.25), 1, E.expoIn);
      $('cursor').style.opacity = 1 - away;
      $('btn-add').style.filter = `brightness(${1 + 0.5 * press})`;
    }

    // live subtotal (real: 4.25*60 = 255, + 38*2 = 331)
    const a = P(t, ev('m1.sum'), 1), b = P(t, ev('m2.sum'), 0.75);
    const v = 255 * a + 76 * b;
    $('subtotal-v').textContent = money(Math.round(v * 100) / 100);
    $('subtotal-v').style.color = b >= 1 ? 'var(--money)' : 'var(--strong)';
    $('subtotal').style.opacity = P(t, ev('m1.sum') - beat(1), 1);
  },
  labor(t, s0, s1) {
    // whip-pan in from the right
    const enter = P(t, ev('labor.in'), 1, E.expoOut);
    const push = E.sineInOut(clamp((t - s0) / (s1 - s0)));
    $('labor-card').style.transform = `translateX(${lerp(900, 0, enter)}px) scale(${APP_SCALE * lerp(0.98, 1.02, push)})`;
    $('labor-card').style.filter = `blur(${lerp(14, 0, enter)}px)`;
    const rateOn = t >= evExact('labor.rate') - beat(0.5), hoursOn = t >= evExact('labor.hours') - beat(0.25);
    field($('l-rate'), typed(t, 'labor.rate', JOB.rate), 'e.g. 35', rateOn && !hoursOn, t);
    field($('l-hours'), typed(t, 'labor.hours', JOB.hours), 'e.g. 8', hoursOn && t < evExact('tap.click') - beat(0.5), t);
    const click = evExact('tap.click');
    const press = cursorTo(t, $('gen-btn'), { x: 1700, y: 1050 }, click, 1.2, click);
    $('cursor').style.opacity = 1;
    $('gen-btn').style.filter = `brightness(${1 + 0.35 * press})`;
    $('gen-btn').style.transform = `scale(${1 - 0.03 * press})`;
  },
  tap(t) {
    const target = parseMoney(EST.tiers[1]);
    const rs = evExact('tap.rollStart'), re = evExact('tap.total');
    const r = clamp((t - rs) / (re - rs));
    $('total').textContent = money(t >= re ? target : Math.round(target * E.expoOut(r) * 100) / 100);
    $('total').style.color = t >= re ? 'var(--money)' : 'var(--strong)';
    const land = clamp(1 - (t - re) / beat(1));
    $('total').style.transform = `scale(${t >= re ? 1 + 0.06 * land : 1})`;
    const s = P(t, ev('tap.total'), 1);
    $('tap-sub').style.opacity = s; $('tap-sub').style.transform = `translateY(${lerp(20, 0, s)}px)`;
  },
  tiers(t) {
    const rec = P(t, ev('tiers.recommend'), 1);
    ['budget', 'standard', 'premium'].forEach((k, i) => {
      const p = clamp((t - ev('tiers.' + k)) / beat(0.5));
      const el = $('tier' + i);
      el.style.opacity = clamp(p * 2.5);
      const base = p <= 0 ? 1.3 : lerp(1.3, 1, E.backOut(p, 1.2));
      el.style.transform = `translateY(${lerp(-40, 0, E.expoOut(p))}px) scale(${base * (i === 1 ? lerp(1, 1.08, rec) : 1)})`;
      if (i !== 1) el.style.filter = `brightness(${lerp(1, 0.6, rec)})`;
    });
    const st = $('tier1');
    st.style.borderColor = rec > 0 ? `rgba(74,140,255,${rec})` : '';
    st.style.boxShadow = `0 0 ${80 * rec}px rgba(74,140,255,${0.35 * rec})`;
    st.querySelector('.price').style.color = rec > 0.5 ? 'var(--money)' : '';
    $('rec-tag').style.opacity = rec;
    $('rec-tag').style.transform = `translateX(-50%) scale(${rec <= 0 ? 0.6 : lerp(0.6, 1, E.backOut(rec))})`;
    const c = P(t, ev('tiers.caption'), 1.5);
    $('tiers-caption').firstElementChild.style.transform = `translateY(${lerp(110, 0, c)}%)`;
  },
  end(t) {
    const p = clamp((t - ev('end.in')) / beat(1));
    $('end-icon').style.transform = `scale(${p <= 0 ? 0 : lerp(0.5, 1, E.backOut(p))})`;
    $('end-icon').style.opacity = clamp(p * 4);
    const l = P(t, ev('end.in'), 1.5);
    $('end-line').firstElementChild.style.transform = `translateY(${lerp(110, 0, l)}%)`;
    const s = P(t, ev('end.sub'), 1.5);
    $('end-sub').style.opacity = s; $('end-sub').style.transform = `translateY(${lerp(30, 0, s)}px)`;
    const f = clamp(1 - Math.abs(t - ev('end.final')) / beat(0.5));
    $('s-end').style.filter = `brightness(${1 + 0.25 * f})`;
  },
};

function drawGrain(frame) {
  const ctx = $('grain').getContext('2d'), img = ctx.createImageData(480, 270), rnd = mulberry32(frame + 1);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  ctx.putImageData(img, 0, 0);
}

function seek(t) {
  $('cursor').style.display = 'none';
  const secs = BEATS.sections;
  for (const sec of secs) {
    const s0 = beat(sec.fromBeat), s1 = beat(sec.toBeat), el = $('s-' + sec.id);
    const last = sec === secs[secs.length - 1];
    const on = t >= s0 - (sec.fromBeat ? LEAD : 0) && (t < s1 - LEAD || (last && t <= DURATION));
    el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    el.style.transform = `scale(${lerp(1, 1.03, clamp((t - s0) / (s1 - s0)))})`;
    scenes[sec.id](t, s0, s1);
  }
  const fl = evExact('tap.flash'), f = clamp(1 - (t - fl + LEAD) / beat(0.6));
  $('flash').style.opacity = t >= fl - LEAD ? E.expoIn(f) * 0.95 : 0;
  $('fadeout').style.opacity = clamp((t - beat(BEATS.bars * BEATS.beatsPerBar)) / BEATS.tailSeconds);
  drawGrain(Math.round(t * BEATS.fps));
}

window.ready = (async () => {
  BEATS = await (await fetch('./beats.json')).json();
  EST = await (await fetch('../../brand/sample-estimate.json')).json();
  SPB = 60 / BEATS.bpm;
  DURATION = beat(BEATS.bars * BEATS.beatsPerBar) + BEATS.tailSeconds;
  build();
  await Promise.all(['800 100px "Inter Display"', '500 40px Inter', '700 40px "JetBrains Mono"', '20px "Noto Color Emoji"'].map(f => document.fonts.load(f)));
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  window.seek = seek; window.DURATION = DURATION;
  seek(0);
  return { duration: DURATION, fps: BEATS.fps };
})();

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else window.ready.then(() => {
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080); $('stage').style.transform = `scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const slug = location.pathname.split('/').filter(Boolean).slice(-2, -1)[0];
  const audio = new Audio(`../../out/${slug}.wav`);
  let playing = false;
  const tick = () => { if (!playing) return; seek(audio.currentTime); $('scrub').value = audio.currentTime / DURATION; $('clock').textContent = audio.currentTime.toFixed(2) + 's'; if (audio.ended) { playing = false; $('play').textContent = 'Play'; } requestAnimationFrame(tick); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { audio.play(); tick(); } else audio.pause(); };
  $('scrub').oninput = e => { audio.currentTime = e.target.value * DURATION; seek(audio.currentTime); $('clock').textContent = audio.currentTime.toFixed(2) + 's'; };
});
</script>
