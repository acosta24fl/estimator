[project]
name = "cinepipe"
version = "0.1.0"
description = "4-stage AI video pre-production pipeline: Story Bible -> Castkit -> Scenecraft -> Shotcaller"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.3", "pydantic>=2.7", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cinepipe = "cinepipe.cinepipe:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cinepipe"]
